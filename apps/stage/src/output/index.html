<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
    />
    <title>Output</title>
    <link rel="stylesheet" href="./output.css" />
  </head>
  <body>
    <!--
      Two layers, so a slide change is a cross-dissolve of opacity on two
      GPU-composited elements rather than a repaint of one (ST6.5).
    -->
    <div class="layer" id="layer-a" aria-hidden="true"></div>
    <div class="layer" id="layer-b" aria-hidden="true"></div>
    <div class="cover" id="cover"></div>
    <script type="module" src="./output.ts"></script>
  </body>
</html>
