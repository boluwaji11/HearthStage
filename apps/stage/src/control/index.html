<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
    />
    <title>Hearth Stage</title>
    <link rel="stylesheet" href="./control.css" />
  </head>
  <body>
    <header>
      <div>
        <h1 id="service"></h1>
        <p id="service-detail" class="quiet"></p>
      </div>
      <div class="header-right">
        <button id="home" type="button" hidden data-t="control.home"></button>
        <button id="slides" type="button" data-t="control.slides"></button>
        <div id="status" class="status"></div>
      </div>
    </header>

    <ul id="problems" class="problems" data-t-label="control.problems"></ul>

    <section id="start" class="start" data-t-label="control.start" hidden>
      <div class="start-inner">
        <h2 data-t="start.name"></h2>
        <div class="start-ways">
          <button id="way-slide" type="button" class="way" data-t="start.makeSlide"></button>
          <button id="way-library" type="button" class="way" data-t="start.openSong"></button>
          <button id="way-sample" type="button" class="way" data-t="start.trySample"></button>
        </div>
      </div>
    </section>

    <main id="running">
      <section class="deck" data-t-label="control.deck">
        <button id="reset-run" type="button" class="reset" hidden data-t="run.reset"></button>
        <ol id="deck"></ol>
      </section>

      <section class="stage" data-t-label="control.stage">
        <div class="pane">
          <h2 data-t="control.live"></h2>
          <div id="live" class="screen live"></div>
          <p id="live-meta" class="quiet"></p>
        </div>
        <div class="pane">
          <h2 data-t="control.next"></h2>
          <div id="next" class="screen next"></div>
          <p id="next-meta" class="quiet"></p>
        </div>
        <div class="pane notes">
          <h2 data-t="control.notes"></h2>
          <ul id="notes"></ul>
        </div>
      </section>
    </main>

    <footer>
      <dl id="keys"></dl>
      <!-- A clock on the wall before a service starts (STG-26, ST5.10). -->
      <div class="countdown-bar">
        <span class="countdown-label" data-t="countdown.label"></span>
        <span id="countdown-set"></span>
        <button id="countdown-stop" type="button" hidden data-t="countdown.stop"></button>
      </div>
      <button id="brief-open" type="button" data-t="brief.open"></button>
    </footer>

    <!-- What the keys do, on one card (STG-27, ST12.10). -->
    <dialog id="brief" class="brief" data-t-label="brief.title">
      <h2 data-t="brief.title"></h2>
      <dl id="brief-keys"></dl>
      <p class="quiet" data-t="brief.holding"></p>
      <button id="brief-close" type="button" class="primary" data-t="brief.close"></button>
    </dialog>

    <script type="module" src="./control.ts"></script>
  </body>
</html>
