<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
    />
    <title>Harness</title>
    <!--
      What the output window loads, exactly. A harness with a stylesheet of its
      own would measure a page no church ever sees.
    -->
    <link rel="stylesheet" href="../output/output.css" />
    <style>
      /* The dissolve layer, at a size a test names rather than the window's. */
      #stage {
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: var(--justify, center);
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
