<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
    />
    <title>Slides</title>
    <link rel="stylesheet" href="./editor.css" />
  </head>
  <body>
    <header>
      <h1>Slides</h1>
      <div class="actions">
        <button id="new" type="button">New</button>
        <button id="present" type="button">Present</button>
      </div>
    </header>

    <main>
      <section class="library" aria-label="Library">
        <div class="field">
          <label for="search">Search</label>
          <input id="search" type="search" autocomplete="off" />
        </div>
        <ol id="library"></ol>
        <p id="library-empty" class="quiet">Nothing saved yet</p>
      </section>

      <section class="edit" aria-label="Edit">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" type="text" autocomplete="off" spellcheck="false" />
        </div>

        <ol id="slides" class="slides"></ol>

        <div class="add">
          <button id="add" type="button" class="primary">Add slide</button>
          <button id="paste" type="button" hidden>Paste slide</button>
        </div>

        <ul id="problems" class="problems"></ul>
      </section>
    </main>

    <footer>
      <p id="status" class="quiet"></p>
      <p id="undone" class="undone" hidden>
        <span id="undone-what"></span>
        <button id="undo" type="button">Undo</button>
      </p>
      <p class="quiet keys">Cmd and Return adds a slide</p>
    </footer>

    <script type="module" src="./editor.ts"></script>
  </body>
</html>
