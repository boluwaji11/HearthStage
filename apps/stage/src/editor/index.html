<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
    />
    <title>Slides</title>
    <link rel="stylesheet" href="./editor.css" />
  </head>
  <body>
    <!-- The library. What the window opens on. -->
    <section id="library-view" class="view library-view" aria-label="Library">
      <header>
        <button id="to-service" type="button" class="back">Service</button>
        <h1>Slides</h1>
        <div class="field search-field">
          <label for="search">Search</label>
          <input id="search" type="search" autocomplete="off" />
        </div>
        <button id="new" type="button" class="primary">New</button>
      </header>
      <div class="tiles-wrap">
        <ol id="tiles" class="tiles"></ol>
        <div id="library-empty" class="empty">
          <p class="quiet">Nothing saved yet</p>
          <button id="add-samples" type="button" class="primary" hidden></button>
        </div>
      </div>
    </section>

    <!-- One thing, open. -->
    <section id="edit-view" class="view edit-view" aria-label="Edit" hidden>
      <header>
        <button id="back" type="button" class="back">All slides</button>
        <div class="field">
          <label for="theme">Look</label>
          <select id="theme"></select>
        </div>
        <button id="present" type="button">Present</button>
      </header>

      <div class="edit-body">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" type="text" autocomplete="off" spellcheck="false" />
        </div>

        <div id="credits" class="credits" hidden>
          <div class="field">
            <label for="author">Author</label>
            <input id="author" type="text" autocomplete="off" />
          </div>
          <div class="field">
            <label for="year">Year</label>
            <input id="year" type="text" inputmode="numeric" autocomplete="off" />
          </div>
          <div class="field">
            <label for="ccli">CCLI number</label>
            <input id="ccli" type="text" inputmode="numeric" autocomplete="off" />
          </div>
          <div class="field grow">
            <label for="copyright">Copyright line</label>
            <input id="copyright" type="text" autocomplete="off" />
          </div>
          <label class="check" for="public-domain">
            <input id="public-domain" type="checkbox" />
            Public domain
          </label>
        </div>

        <ol id="slides" class="slides"></ol>

        <div class="add">
          <button id="add" type="button" class="primary">Add slide</button>
          <button id="paste" type="button" hidden>Paste slide</button>
        </div>

        <!-- The ways a song is sung (STG-9). Absent on a sheet of slides. -->
        <section id="orders" class="orders" aria-label="Orders" hidden>
          <h2>Orders</h2>
          <ol id="order-list" class="order-list"></ol>
          <button id="add-order" type="button">Add order</button>
        </section>

        <ul id="problems" class="problems"></ul>
      </div>

      <footer>
        <p id="status" class="quiet"></p>
        <p id="undone" class="undone" hidden>
          <span id="undone-what"></span>
          <button id="undo" type="button">Undo</button>
        </p>
        <p class="quiet keys">Cmd and Return adds a slide</p>
      </footer>
    </section>

    <script type="module" src="./editor.ts"></script>
  </body>
</html>
